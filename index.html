<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<title>✈️ Lịch trình Đà Lạt</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f9fc}
.app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#f7f9fc}
.open{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;padding:9px 13px;border:1px solid #dbe5f3;border-radius:999px;background:#ffffffed;color:#2563eb;text-decoration:none;font-size:12px;font-weight:600;box-shadow:0 4px 16px #1d35551c}
.open:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
@media(max-width:600px){.open{right:10px;bottom:calc(78px + env(safe-area-inset-bottom));font-size:11px;padding:7px 10px;opacity:.88}}
</style>
</head>
<body>
<iframe class="app" title="Lịch trình Đà Lạt" src="https://script.google.com/macros/s/AKfycbypP7D9e8JwAF6JCpgS8MbyZDTFI35rF2xA5Y1FUU6V/exec" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<a class="open" href="https://script.google.com/macros/s/AKfycbypP7D9e8JwAF6JCpgS8MbyZDTFI35rF2xA5Y1FUU6V/exec" target="_blank" rel="noopener noreferrer">Mở trực tiếp ↗</a>
