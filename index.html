
<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <title>Đà Lạt Plan</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E✈️%3C/text%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      background: #f7f9fc;
    }

    .app {
      position: fixed;
      inset: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: #f7f9fc;
    }

    .open-app {
      position: fixed;
      right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 20;
      padding: 12px 16px;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 16px #2563eb44;
    }
  </style>
</head>
<body>
  <div class="app">
    <iframe
      id="appFrame"
      title="Đà Lạt Plan"
      allow="camera"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <a class="open-app" id="openApp"
     target="_blank"
     rel="noopener noreferrer">
    Mở ứng dụng trực tiếp ↗
  </a>

  <script>
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbzYdgCTg6Ez09s11hJ1oLx2jzGE15VqFkAldifLmxa17g7uWvL7t5tnCc-GBjVYGNTX/exec";

    document.getElementById("appFrame").src = APP_URL;
    document.getElementById("openApp").href = APP_URL;
  </script>
</body>
</html>
